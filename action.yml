name: Self Approve
description:
  Approve a pull request as github-actions[bot] when it is not a draft and its
  author is listed in the repository's CODEOWNERS file
author: ocavue

branding:
  icon: check-circle
  color: green

inputs:
  github-token:
    description:
      Token used to create the approving review. Defaults to the workflow token,
      so the review is authored by github-actions[bot].
    required: false
    default: ${{ github.token }}

outputs:
  approved:
    description: '"true" when this run created an approving review'
  reason:
    description:
      Why the pull request was not approved, when `approved` is "false"

runs:
  using: node24
  main: dist/index.js
